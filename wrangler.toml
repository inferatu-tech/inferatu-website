name = "inferatu-website"
compatibility_date = "2026-10-06"

# Production is on the custom domains; retire the public workers.dev URL but
# keep per-build Preview URLs (behind Access, noindex via _headers).
# Declaring [[routes]] flips Wrangler's defaults for both, so set them explicitly.
workers_dev = false
preview_urls = true

[assets]
directory = "."
not_found_handling = "404-page"       # serve 404.html with a 404 status
html_handling = "auto-trailing-slash"

# Custom domains were attached in the dashboard first (2026-10-06); these
# declarations keep config and dashboard in sync.
[[routes]]
pattern = "www.inferatu.com"
custom_domain = true

[[routes]]
pattern = "inferatu.com"
custom_domain = true
